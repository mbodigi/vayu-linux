# Home of the login screen's account (Quickshell/Mango keep their cache there)
d /var/lib/greeter 0755 greeter greeter -
# The login screen needs no portals or user folders; with its session target running they would start
d /var/lib/greeter/.config 0700 greeter greeter -
d /var/lib/greeter/.config/systemd 0755 greeter greeter -
d /var/lib/greeter/.config/systemd/user 0755 greeter greeter -
L /var/lib/greeter/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
L /var/lib/greeter/.config/systemd/user/xdg-user-dirs.service - - - - /dev/null
