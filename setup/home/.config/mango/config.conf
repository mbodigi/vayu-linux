# MangoWM configuration.
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./conf.d fragments below. Add your own binds/rules here or in those files.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland


source=./conf.d/colors.conf
source=./conf.d/layout.conf
source=./conf.d/cursor.conf
source=./conf.d/input.conf
source=./conf.d/outputs.conf
source=./conf.d/windowrules.conf
source=./conf.d/binds.conf

# Hot corner: push the pointer into the bottom-left corner to open the overview
enable_hotarea=1
hotarea_size=10
hotarea_disable_on_fullscreen=1

# Qt apps: theme via qt5ct/qt6ct (matugen writes matching colors into */colors/matugen.conf)
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_QPA_PLATFORMTHEME_QT6,qt6ct
exec_once=systemctl --user set-environment QT_QPA_PLATFORMTHEME=qt5ct QT_QPA_PLATFORMTHEME_QT6=qt6ct

# Width presets cycled by Super+Shift+R
scroller_proportion_preset=0.5,0.8,1.0

# Snappier animations (defaults: open 400, move 500, close 800)
animation_duration_open=300
animation_duration_move=300
animation_duration_tag=300
animation_duration_close=250
animation_type_open=zoom
animation_type_close=zoom

# Light blur behind the bar and popups (layer surfaces) only
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5

# Drop-down terminal: Super+` toggles a Ghostty that slides down from the top
window_rule=is_named_scratchpad:1,width:1600,height:540,offset_y:-100,animation_type_open:slide,animation_type_close:slide,app_id:^dev\.dropdown\.ghostty$
bind=SUPER,grave,toggle_named_scratchpad,dev.dropdown.ghostty,none,ghostty --class=dev.dropdown.ghostty --gtk-single-instance=false

# Float file pickers and other small dialogs, centered
window_rule=is_floating:1,width:1100,height:700,app_id:^xdg-desktop-portal-(gtk|gnome|kde)$
window_rule=is_floating:1,width:1100,height:700,title:^(Open|Save|Save As|Open File|Open Files|Open Folder|Select Folder|Choose Files?|File Upload|Export|Import)( .*)?$
window_rule=is_floating:1,title:^(Properties|Preferences|Settings|About|Confirm|Rename)( .*)?$
window_rule=is_floating:1,app_id:^(thunar|Thunar)$,title:^(File Operation Progress|Confirm to replace files|Rename ".*")$

# Focus follows mouse
sloppy_focus=1

# Mac-style minimize: Super+M sends the focused window to the scratchpad, Super+Shift+M restores it (dock click also restores)
bind=SUPER,m,minimized,
bind=SUPER+SHIFT,m,restore_minimized,

# The dock is part of the Quickshell shell (dock/Dock.qml).

# Our own Quickshell shell: ~/.config/quickshell/shell
exec_once=env QSG_RHI_BACKEND=vulkan qs -c shell


# first login of a new user: dconf settings (fonts, theme, Celluloid)
exec_once=/usr/local/bin/shell-firstlogin
