# Keybinds (MangoWM).
# Format: bind=MODS,key,action[,args]
# Put bind descriptions above bind lines; inline # comments break Mango spawn args.

# === Application Launchers ===
# Open Terminal
bind=SUPER,Return,spawn,sh -c "mmsg dispatch view,2; exec ghostty"
# Application Launcher
bind=SUPER,space,spawn,qs -c shell ipc call launcher toggle
# All Apps
bind=SUPER,a,spawn,qs -c shell ipc call apps toggle
# Spotlight Bar
# Clipboard Manager
bind=SUPER,v,spawn,qs -c shell ipc call clipboard toggle
# Media
# Settings
bind=SUPER,comma,spawn,qs -c shell ipc call settings toggle
# Notification Center
bind=SUPER+CTRL,n,spawn,qs -c shell ipc call notifications toggleCenter
# Browse Wallpapers
bind=SUPER,y,spawn,qs -c shell ipc call dashboard toggleTab wallpapers
# Power Menu
bind=SUPER,x,spawn,qs -c shell ipc call power toggle
# Quick Settings
bind=SUPER,s,spawn,qs -c shell ipc call control toggle
# Dash
bind=SUPER,d,spawn,qs -c shell ipc call dashboard toggleTab overview
# Idle Inhibit
bind=SUPER+ALT,i,spawn,qs -c shell ipc call coffee toggle

# === Cheat sheet ===
# Keyboard Shortcuts
bind=SUPER+SHIFT,slash,spawn,qs -c shell ipc call cheatsheet toggle

# === Security ===
# Lock Screen
bind=SUPER+ALT,l,spawn,qs -c shell ipc call lock lock
# Task Manager
bind=CTRL+ALT,Delete,spawn,qs -c shell ipc call tasks toggle
# Task Manager
bind=CTRL+ALT,m,spawn,qs -c shell ipc call tasks toggle

# === Window Rules ===

# === Screenshots ===
# Screenshot: Interactive
bind=none,Print,spawn,/usr/local/bin/shot region
# Screenshot: Full Screen
bind=CTRL,Print,spawn,/usr/local/bin/shot full
# Screenshot: Window
bind=ALT,Print,spawn,/usr/local/bin/shot window

# XF86AudioPause is level 2 of the play/pause keycode: a keysym bind keeps Mango from flagging it as a conflict with XF86AudioPlay.
# === Audio Controls ===
bindl=none,XF86AudioRaiseVolume,spawn,qs -c shell ipc call osd volumeUp
bindl=none,XF86AudioLowerVolume,spawn,qs -c shell ipc call osd volumeDown
bindl=none,XF86AudioMute,spawn,qs -c shell ipc call osd mute
bindl=none,XF86AudioMicMute,spawn,qs -c shell ipc call osd micMute
bindl=none,XF86AudioPlay,spawn,qs -c shell ipc call osd playPause
bindsl=none,XF86AudioPause,spawn,qs -c shell ipc call osd playPause
bindl=none,XF86AudioPrev,spawn,qs -c shell ipc call osd previous
bindl=none,XF86AudioNext,spawn,qs -c shell ipc call osd next

# === Brightness Controls ===
bindl=none,XF86MonBrightnessUp,spawn,qs -c shell ipc call osd brightnessUp
bindl=none,XF86MonBrightnessDown,spawn,qs -c shell ipc call osd brightnessDown

# === Window Management ===
# Close Window
bind=SUPER,q,killclient,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+ALT,f,togglefakefullscreen,
bind=SUPER+SHIFT,space,togglefloating,
# Cycle Layout
bind=SUPER+SHIFT,t,switch_layout
# Show Window on All Tags
bind=SUPER,g,toggleglobal,
# Keep Window on Top
bind=SUPER+CTRL,o,toggleoverlay,
bind=SUPER,o,toggleoverview
# Next Window (all tags)
bind=ALT,Tab,spawn,/usr/local/bin/mango-cycle next
# Previous Window (all tags)
bind=ALT+SHIFT,Tab,spawn,/usr/local/bin/mango-cycle prev
# Jump to Window
bind=SUPER+SHIFT,o,togglejump,
bind=SUPER+SHIFT,p,spawn,qs -c shell ipc call dock togglePin
bind=SUPER,r,reload_config
# Exit Compositor
bind=SUPER+SHIFT,e,quit,

# === Focus Navigation ===
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,L,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,K,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,J,focusdir,down

# === Window Movement ===
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down

# === Window Sizing ===
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0
bind=SUPER+CTRL,minus,resizewin,+0,-50
bind=SUPER+CTRL,equal,resizewin,+0,+50
bind=SUPER+ALT+SHIFT,Left,movewin,-50,+0
bind=SUPER+ALT+SHIFT,Right,movewin,+50,+0
bind=SUPER+ALT+SHIFT,Up,movewin,+0,-50
bind=SUPER+ALT+SHIFT,Down,movewin,+0,+50

# === Monitor Navigation ===
# Move Window to Previous Tag (and follow)
bind=SUPER+CTRL,Left,tagtoleft,0
# Move Window to Next Tag (and follow)
bind=SUPER+CTRL,Right,tagtoright,0
bind=SUPER+CTRL,H,focusmon,left
bind=SUPER+CTRL,J,focusmon,down
bind=SUPER+CTRL,K,focusmon,up
bind=SUPER+CTRL,L,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Down,tagmon,down

# === Layout ===
# Cycle Layout - Gaps, Floating, Tiling
bind=SUPER+ALT,j,switch_layout
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER+SHIFT,r,switch_proportion_preset,
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
# Toggle Split Direction
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction

# === Tags: previous / next ===
# Previous Tag
bind=SUPER+ALT,Left,viewtoleft,0
# Next Tag
bind=SUPER+ALT,Right,viewtoright,0
# Previous Occupied Tag
bind=SUPER,Page_Up,viewtoleft_have_client,0
# Next Occupied Tag
bind=SUPER,Page_Down,viewtoright_have_client,0
# Move Window to Previous Tag
bind=SUPER+CTRL,Up,tagtoleft,0
# Move Window to Next Tag
bind=SUPER+CTRL,Down,tagtoright,0
bind=SUPER+CTRL,I,tagtoleft,0
bind=SUPER+CTRL,U,tagtoright,0

# === Tags (1-9): view tag ===
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# === Tags (1-9): move focused window to tag ===
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# === Mouse Wheel ===
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# === Touchpad Gestures ===
# 3-finger horizontal swipe: switch between occupied workspaces
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client
# 3-finger vertical swipe: focus the window above or below
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
# 4-finger horizontal swipe: move the focused window to the previous/next tag
gesturebind=none,right,4,tagtoleft,0
gesturebind=none,left,4,tagtoright,0
# 4-finger vertical swipe: toggle the overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# === Mouse ===
# Super + left drag moves a window, Super + right drag resizes it
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
