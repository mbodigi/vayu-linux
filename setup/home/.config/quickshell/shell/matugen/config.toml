# matugen recipes for our shell: wallpaper -> colors for the shell, GTK, Qt and mango borders.
# Run by services/Wallpaper.qml.
[config]

[templates.shell]
input_path = '~/.config/quickshell/shell/matugen/templates/shell-colors.json'
output_path = '~/.local/state/shell/colors.json'

[templates.gtk3]
input_path = '~/.config/quickshell/shell/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/matugen-colors.css'

[templates.gtk4]
input_path = '~/.config/quickshell/shell/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/matugen-colors.css'

[templates.qt5ct]
input_path = '~/.config/quickshell/shell/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/quickshell/shell/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.mango]
input_path = '~/.config/quickshell/shell/matugen/templates/mango-colors.conf'
output_path = '~/.config/mango/conf.d/colors.conf'
post_hook = 'mmsg dispatch reload_config'

# login screen (read by the greeter user; folder is <user>:greeter 2750)
[templates.greeter]
input_path = '~/.config/quickshell/shell/matugen/templates/shell-colors.json'
output_path = '/var/cache/shell-greeter/colors.json'

# Ghostty theme "matugen" (theme = matugen in ~/.config/ghostty/config); SIGUSR2 makes Ghostty reload it live
[templates.ghostty]
input_path = '~/.config/quickshell/shell/matugen/templates/ghostty-colors'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'pkill -USR2 -x ghostty'
